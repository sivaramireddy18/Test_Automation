[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stm32-test-automation"
version = "0.1.0"
description = "API-driven STM32 validation automation framework"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
valgen = "framework.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
